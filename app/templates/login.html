{% extends "base.html" %}
{% block title %}Iniciar sesión · EcoValdivia{% endblock %}
{% block content %}
<h1 class="h3">Iniciar sesión</h1>
<form method="post" action="{{ url_for('auth.login') }}" class="col-md-6 col-lg-4">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="mb-3">
        <label for="username" class="form-label">Usuario</label>
        <input id="username" name="username" class="form-control" maxlength="100" autocomplete="username" required>
    </div>
    <div class="mb-3">
        <label for="password" class="form-label">Contraseña</label>
        <input id="password" name="password" type="password" class="form-control" autocomplete="current-password" required>
    </div>
    <button class="btn btn-success" type="submit">Iniciar sesión</button>
</form>
{% endblock %}
